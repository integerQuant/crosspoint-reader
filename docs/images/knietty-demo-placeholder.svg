<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title description">
  <title id="title">knietty hardware demo placeholder</title>
  <desc id="description">A monochrome illustration marking where an authentic XTEINK X4 terminal recording will appear.</desc>

  <rect width="1200" height="675" rx="28" fill="#0d1117"/>
  <rect x="112" y="70" width="976" height="535" rx="38" fill="#d8d2c2" stroke="#f0eadb" stroke-width="4"/>
  <rect x="157" y="111" width="829" height="453" rx="8" fill="#f5f1df" stroke="#111111" stroke-width="4"/>

  <line x1="157" y1="156" x2="986" y2="156" stroke="#111111" stroke-width="3"/>
  <text x="181" y="142" fill="#111111" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="22" font-weight="700">knietty@host</text>
  <text x="854" y="142" fill="#111111" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20">80% 12:48</text>

  <g fill="#111111" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="25">
    <text x="181" y="204">$ knietty --host auto</text>
    <text x="181" y="244">connected · TLS 1.3 · 80x24</text>
    <text x="181" y="304">$ tmux attach -t knietty</text>
    <text x="181" y="344">$ _</text>
  </g>

  <rect x="218" y="407" width="706" height="86" fill="none" stroke="#111111" stroke-width="3" stroke-dasharray="10 8"/>
  <text x="571" y="443" text-anchor="middle" fill="#111111" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="22" font-weight="700">AUTHENTIC X4 DEMO COMING SOON</text>
  <text x="571" y="474" text-anchor="middle" fill="#111111" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16">recorded on hardware · no simulated footage</text>

  <circle cx="1036" cy="182" r="15" fill="#1f2328"/>
  <circle cx="1036" cy="239" r="15" fill="#1f2328"/>
  <circle cx="1036" cy="296" r="15" fill="#1f2328"/>
  <circle cx="1036" cy="353" r="15" fill="#1f2328"/>

  <text x="600" y="644" text-anchor="middle" fill="#b8c0cc" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18">EINK backwards → KNIE + TTY</text>
</svg>
