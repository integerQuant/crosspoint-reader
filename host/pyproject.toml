[project]
name = "knietty-host"
version = "0.1.0"
description = "Portable PTY to Wi-Fi bridge for knietty"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["pyserial>=3.5,<4"]

[project.scripts]
knietty = "knietty:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = ["knietty.py", "knietty_protocol.py"]
